metadata:
  author:
    first: Frank
    last: Cai
    email: cai485@purdue.edu
    github_id: fronkt
  timestamp: 'Tue, 24 Nov 2026 08:47:46 GMT'
  summary: >-
    Browser-native WebGPU conserved Cahn-Hilliard 2D phase-field solver
    (SOLIDIFY v8.5.0, periodic 9-point Mehrstellen stencil in centered WGSL
    float32) on 200x200 [0,200]^2 (dx = 1.0000,
    dt = 0.003363, 297374 explicit steps to
    t = 1000.00, Jokisaari et al., Comput. Mater. Sci. 126
    (2017) 139-151).
  implementation:
    name: solidify
    repo:
      url: 'https://github.com/fronkt/solidify'
      version: v8.5.0
    container_url: 'https://solidify.frankcai.dev/'
  hardware:
    cpu_architecture: x64
    acc_architecture: WebGPU
    parallel_model: gpu
    clock_rate: '0'
    cores: '8'
    nodes: '1'
benchmark:
  id: 1a
  version: '1'
data:
  - name: run_time
    values:
      - wall_time: '15.39'
        sim_time: '1000.00'
  - name: free_energy
    url: 'free_energy.csv'
    format:
      type: csv
      parse:
        time: number
        free_energy: number
    description: Total Cahn-Hilliard free energy as a function of time
    type: line
    transform:
      - type: formula
        expr: datum.time
        as: x
      - type: formula
        expr: datum.free_energy
        as: 'y'
  - name: domain_length
    url: 'bm1_results.csv'
    format:
      type: csv
      parse:
        time: number
        domain_L: number
    description: Characteristic interfacial domain length L(t) as a function of time
    type: line
    transform:
      - type: formula
        expr: datum.time
        as: x
      - type: formula
        expr: datum.domain_L
        as: 'y'
